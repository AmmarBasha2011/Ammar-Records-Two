name: Video Autopost (segment -> webhook)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  make-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Pick random segment range
        id: pick
        run: |
          python - <<'PY'
          import os, json, random
          iden = json.load(open("115/iden.json", encoding="utf-8"))
          segments = iden.get("segments", [])
          keys = [str(s["id"]) for s in segments]
          idn = iden
          span = random.randint(1, min(6, len(keys)))
          start_idx = random.randint(0, len(keys) - span)
          end_idx = start_idx + span - 1
          selected = segments[start_idx:end_idx+1]
          with open("pick.txt", "w", encoding="utf-8") as f:
              f.write("115" + chr(10) + idn["name"] + chr(10) + str(start_idx+1) + chr(10) + str(end_idx+1) + chr(10))
          print(f"picked nasheed 115 segments {start_idx+1}-{end_idx+1} (SHORT)")
          PY

      - name: Build video with ffmpeg
        run: |
          KEY=$(sed -n 1p pick.txt); NAME=$(sed -n 2p pick.txt)
          START=$(sed -n 3p pick.txt); END=$(sed -n 4p pick.txt)
          mkdir -p build
          ffmpeg -y $(for a in $(seq -w $START $END); do echo -n "-i 115/$(printf '%03d' $a).mp3 "; done) \
            -filter_complex "[0:a]$(for i in $(seq 1 $((END-START))); do echo -n "[$i:a]"; done)concat=n=$((END-START+1)):v=0:a=1[aout]" \
            -map "[aout]" build/audio.mp3
          RAWBG=$(ls assets/backgrounds/*.{jpg,jpeg,png,webp} 2>/dev/null | shuf -n1)
          EXT="${RAWBG##*.}"
          if [ "$EXT" = "webp" ]; then
            BG="build/bg.png"
            ffmpeg -y -i "$RAWBG" "$BG"
          else
            BG="$RAWBG"
          fi
          DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 build/audio.mp3)
          ffmpeg -y -loop 1 -i "$BG" -i build/audio.mp3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2" \
            -c:v libx264 -tune stillimage -pix_fmt yuv420p -r 25 \
            -c:a aac -b:a 128k -shortest -t "$DUR" -t 175 \
            build/video.mp4
          echo "video built: $(ls -la build/video.mp4 | awk '{print $5}') bytes"

      - name: Send Short metadata to webhook
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/send_webhook.py "https://flow.sokt.io/func/scri445wtgHf"
